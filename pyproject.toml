[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-safety-exp"
version = "0.1.0"
description = "Reproducible retrieval-stage skill safety experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
skill-exp = "skill_safety.cli:main"

[tool.setuptools.packages.find]
include = ["skill_safety*"]
